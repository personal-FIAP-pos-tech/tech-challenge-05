spring:
  application:
    name: packagemanagement

  datasource:
    url: jdbc:h2:mem:encomendas;DB_CLOSE_DELAY=-1
    username: sa
    password:

  sql:
    init:
      mode: always
      encoding: UTF-8

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: true
