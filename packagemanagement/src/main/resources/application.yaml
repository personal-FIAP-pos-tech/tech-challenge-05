spring:
  application:
    name: packagemanagement

  datasource:
    url: jdbc:h2:mem:encomendas;DB_CLOSE_DELAY=-1
    username: sa
    password:

  sql:
    init:
      mode: always
      encoding: UTF-8

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: true

app:
  jwt:
    secret: ${JWT_SECRET:tech-challenge-fase-5-chave-secreta-padrao-hs256}
    expiracao: ${JWT_EXPIRACAO:1h}
